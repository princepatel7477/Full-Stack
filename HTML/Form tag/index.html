<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend align="center"> Basic Form</legend>
    <form>
        <label for="fullName">Full Name :</label>
        <input type="text" name="fullName" id="fullName" placeholder=" Enter Full Name">
        <br />
        <br />

        <label for="email"> Email :</label>
        <input type="email" name="email" id="email" placeholder=" your email" >
        <br />
        <br />

        <label for="Number"> Mobile :</label>
        <input type="number" name="Number" id="Number" 
        >
        <br />
        <br />

        <label for="password"> Enter password :</label>
        <input type="password" name="password" id="password" placeholder=" your password">
        <br />
        <br />
        
        <label for="cfpassword"> Confirm password :</label>
        <input type="cfpassword" name="cfpassword" id="cfpassword" placeholder=" Confirm password">
        <br />
        <br />

        <label for="Course">Course :</label>
        <select>
            <option value=""> --Select Course--</option>
            <option value="BCA">JAVA</option>
            <option value="B.tech">Python</option>
             <option value="M.tech">C++</option>
        </select>
        <br />
        <br />
         
        <label for="address"> Address :</label>
        <textarea name="address" id="address"></textarea>
        <br />
        <br />

        <label for="JoiningTime">Joining Time :</label>
        <input type="datetime-local" name="JoiningTime" id="JoiningTime">

        <br />
        <br />

        <label for="Volume"> Volume :</label>
        <input type="range" name="Volume" id="Volume" min="1" max="10">
        <br />
        <br />

        <label for="resume"> Resume :</label>
        <input type="file" name="resume" id="resume">
        <br />
        <br />

        <label for="gender"> Gender :</label>
        <input type="radio" name="" id="male" value="male">
        <span>Male</span>

        <input type="radio" name="" id="male" value="female">
        <span>FeMale</span>

        <input type="radio" name="" id="Other" value="Other">
        <span>Other</span>




        <button> Submit</button>







    </form>
    </fieldset>
    
</body>
</html>
