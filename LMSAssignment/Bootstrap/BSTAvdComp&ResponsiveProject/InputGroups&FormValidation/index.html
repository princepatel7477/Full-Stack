<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Input Groups</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">

        <h2 class="text-center text-primary mb-4">
            Bootstrap Input Groups
        </h2>
        <div class="card shadow p-4 mb-4">

            <h4 class="mb-4">1. Input Groups Examples</h4>
            <label class="form-label">Username</label>
            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control"
                       placeholder="Enter username">
            </div>

            <label class="form-label">Website Address</label>
            <div class="input-group mb-3">
                <span class="input-group-text">https://</span>
                <input type="text" class="form-control"
                       placeholder="www.example.com">
            </div>

            <label class="form-label">Search Course</label>
            <div class="input-group mb-3">
                <input type="text" class="form-control"
                       placeholder="Search your course">
                <button class="btn btn-primary" type="button">
                    Search
                </button>
            </div>

            <label class="form-label">Email Subscription</label>
            <div class="input-group mb-3">
                <input type="email" class="form-control"
                       placeholder="Enter your email">
                <button class="btn btn-success" type="button">
                    Subscribe
                </button>
            </div>

        </div>

        <div class="card shadow p-4">
            <h4 class="mb-4">2. Form Validation</h4>
            <h5 class="text-success">Valid Email</h5>

            <div class="mb-4">
                <label class="form-label">Email Address</label>

                <input type="email"
                       class="form-control is-valid"
                       value="prince@gmail.com">

                <div class="valid-feedback">
                    Looks good! Your email is valid.
                </div>
            </div>
            <h5 class="text-danger">Invalid Email</h5>

            <div class="mb-3">
                <label class="form-label">Email Address</label>

                <input type="email"
                       class="form-control is-invalid"
                       value="prince123">

                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

        </div>

    </div>

</body>
</html>
