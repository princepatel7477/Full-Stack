
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Themes Assignment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bs-primary: #6f42c1;
            --bs-success: #198754;
            --bs-warning: #ffc107;
        }

        .custom-btn {
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: bold;
        }

        .custom-card {
            border-radius: 20px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">

        <h2 class="text-center mb-4">
            Bootstrap Themes Assignment
        </h2>

        <div class="card p-4 mb-4 shadow">

            <h4 class="mb-3">1. Customized Color Theme</h4>

            <p>Click the buttons to see different Bootstrap theme colors.</p>

            <button class="btn btn-primary me-2 mb-2">
                Get Started
            </button>

            <button class="btn btn-success me-2 mb-2">
                Success
            </button>

            <button class="btn btn-warning mb-2">
                Warning
            </button>

        </div>

        <div class="card p-4 shadow">

            <h4 class="mb-3">2. Custom Component Styling</h4>
            <button class="btn btn-primary custom-btn mb-4">
                Custom Button
            </button>

            <div class="card custom-card shadow-sm">

                <div class="card-body">

                    <h5 class="card-title">
                        Full Stack Web Development
                    </h5>

                    <p class="card-text">
                        Learn HTML, CSS, JavaScript, Bootstrap,
                        React and Node.js to become a full stack developer.
                    </p>

                    <button class="btn btn-primary">
                        Learn More
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
