<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modals Tooltips and Popovers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center text-primary mb-4">
            Bootstrap Modals, Tooltips & Popovers
        </h2>
        <div class="card p-4 mb-4 shadow">

            <h4>1. Bootstrap Course Modal</h4>

            <button class="btn btn-primary mt-3"
                    data-bs-toggle="modal"
                    data-bs-target="#courseModal">
                View Course
            </button>

            <div class="modal fade" id="courseModal">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Full Stack Web Development</h5>
                            <button type="button" class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <p>Learn HTML, CSS, JavaScript, React and Node.js.</p>
                            <p>Duration: 6 Months</p>
                            <p>Level: Beginner to Advanced</p>
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Close
                            </button>

                            <button class="btn btn-success">
                                Start Course
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <button class="btn btn-danger mt-3"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteModal">
                Delete Course
            </button>
            <div class="modal fade" id="deleteModal">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Delete Course</h5>
                            <button type="button" class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            Are you sure you want to delete this course?
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <button class="btn btn-danger"
                                    data-bs-dismiss="modal">
                                Delete
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>


        <div class="card p-4 shadow">

            <h4>2. Bootstrap Tooltips & Popovers</h4>
            <button class="btn btn-info mt-3"
                    data-bs-toggle="tooltip"
                    data-bs-placement="top"
                    data-bs-title="Click here to learn more!">
                Hover Me
            </button>

            <br><br>

            <button class="btn btn-success"
                    data-bs-toggle="popover"
                    data-bs-title="Course Information"
                    data-bs-content="This course teaches HTML, CSS, JavaScript, React and Bootstrap.">
                Course Info
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
