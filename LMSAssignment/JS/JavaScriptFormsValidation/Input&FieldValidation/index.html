<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>RICR Student Age and Username Checker</h1>

    <label>Enter Student Age:</label>
    <input type="number" id="age">
    <button id="checkAge">Check Age</button>

    <br><br>

    <label>Enter Quantity:</label>
    <input type="number" id="quantity" min="1" max="10">
    
    <br><br>

    <label>Enter Username:</label>
    <input type="text" id="username">

    <hr>

    <h1>RICR Student Score and Registration Code Validator</h1>

    <form id="scoreForm">
        <label>Enter Student Marks:</label>
        <input type="number" id="marks" min="0" max="100" required>

        <br><br>

        <label>Enter Attendance:</label>
        <input type="number" id="attendance" min="0" max="100" required>

        <br><br>

        <button type="button" id="checkForm">Check Form</button>
    </form>

    <br>

    <label>Registration Code:</label>
    <input type="text" id="registrationCode">

    <br><br>

    <button type="button" id="checkCode">Check Registration Code</button>

    <script src="script.js"></script>
</body>
</html>
