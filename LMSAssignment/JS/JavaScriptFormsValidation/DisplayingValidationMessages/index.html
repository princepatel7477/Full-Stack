<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>RICR Student Registration Error Messages</h1>

    <form>
        <label>Full Name:</label>
        <input type="text" id="fullName">
        <span id="nameError" style="color: red;"></span>
        <br><br>

        <button type="button" onclick="validateName()">Check Name</button>
        <br><br>

        <label>Username:</label>
        <input type="text" id="username">
        <span id="usernameError" style="color: red;"></span>
        <br><br>

        <label>Email:</label>
        <input type="email" id="studentEmail">
        <span id="studentEmailError" style="color: red;"></span>
        <br><br>
    </form>

    <hr>

    <h1>RICR Course Registration Validation Message Manager</h1>

    <form>
        <label>Email Address:</label>
        <input type="email" id="courseEmail" required>
        <br><br>

        <button type="button" id="checkCourseEmail">Check Email</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
