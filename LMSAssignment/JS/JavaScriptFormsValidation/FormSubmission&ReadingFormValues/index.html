<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>RICR Student Registration Form</h1>

    <form id="studentForm">
        <label>Full Name:</label>
        <input type="text" id="fullName" name="fullName" required>
        <br><br>

        <label>Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label>Course Name:</label>
        <input type="text" id="courseName" name="courseName" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <hr>

    <h1>RICR Course Enquiry Form Using FormData</h1>

    <form id="courseEnquiryForm">
        <label>Visitor Name:</label>
        <input type="text" id="visitorName" name="visitorName" required>
        <br><br>

        <label>Email Address:</label>
        <input type="email" id="visitorEmail" name="visitorEmail" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label>Interested Course:</label>
        <input type="text" id="interestedCourse" name="interestedCourse" required>
        <br><br>

        <button type="submit">Submit Enquiry</button>
    </form>

    <script src="script.js"></script>

</body>
</html>
