<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <h2>RICR Student Information</h2>

    <label>Enter Student Name:</label>
    <input type="text" id="studentName">

    <p id="namePreview">Your name will appear here.</p>

    <label>Enter Course Name:</label>
    <input type="text" id="courseName">

    <p id="coursePreview">Your course will appear here.</p>

    <hr>

    <h2>RICR Course Enrollment</h2>

    <form id="enrollmentForm">

        <label>Student Name:</label>
        <input type="text" id="enrollName" required>

        <br><br>

        <label>Course Name:</label>
        <input type="text" id="enrollCourse" required>

        <br><br>

        <button type="submit">Enroll Now</button>

    </form>

    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
