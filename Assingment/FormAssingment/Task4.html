<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <center><h1>Task 4:</h1></center>
    <hr>
    <table border="1" cellpadding="5" cellspacing="2" >
        <Form>
            <tr>
               <th colspan="4">Registration Form</th> 
            </tr>
            <tr>
                <td>Student Name</td>
                <td>
                    <input type="Name" name="Name" id="Name" placeholder="First Name">
                </td>
                <td>
                    <input type="Name" name="Name" id="Name" placeholder="Middile Name">
                </td>
                <td>
                    <input type="Name" name="Name" id="Name" placeholder="Last Name">
                </td>
            </tr>

             <tr>
                <td>Father's Name</td>
                <td>
                    <input type="Name" name="Name" id="Name" placeholder="Enter your father's Name">
                </td>
                <td>
                   Mother's Name
                </td>
                <td>
                    <input type="Name" name="Name" id="Name" placeholder="Enter your Mother's Name Name">
                </td>
            </tr>
            
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date" name="date" id="date">
                </td>
                <td>
                   Gender
                </td>
                <td>
                    <span>Male</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>Female</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                </td>
            </tr>

            <tr>
                <td>Category</td>
                <td>
                    <span>Gen</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>OBC</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>SC/ST</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                </td>
                <td>
                   Handicapped
                </td>
                <td>
                <span>Yes</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>No</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                </td>
            </tr>
            <tr>
                <td>Ex-Serviceman</td>
                <td>
                   <span>Yes</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>No</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                </td>
                <td>
                   EWS
                </td>
                <td>
                    <span>Yes</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                    <span>No</span>
                    <label for="radio1"></label>
                    <input type="radio" name="radio1" id="radio1">
                </td>
            </tr>

             <tr>
                <td>Email ID</td>
                <td>
                    <input type="email" name="email" id="email">
                </td>
                <td>
                  Mobile No.
                </td>
                <td>
                    <input type="Phone" name="Phone" id="Phone">
                </td>

                <tr>
                <td>State</td>
                <td>
                    <select>
                        <option value="Select any One">Select any One</option>
                        <option value="M.P">M.P</option>
                        <option value="U.P">U.P</option>
                        <option value="U.K">U.K</option>
                    </select>
                </td>
                <td>
                  City
                </td>
                <td>
                    <select>
                        <option value="Select any One">Select any One</option>
                        <option value="Satna">Satna</option>
                        <option value="Katni">Katni</option>
                        <option value="Jabalpur">Jabalpur</option>
                    </select>
                </td>

                <tr>
                <td>Upload Photo</td>
                <td>
                    <input type="file" name="file" id="file" >
                </td>
                <td>
                   Upload Signature
                </td>
                <td>
                   <input type="file" name="file" id="file">
                </td>
            </tr>
            <tr>
                <th colspan="4">
                    <button>Submit</button>
                </th>
            </tr>  
        </Form>
    </table>
    

    
</body>
</html>
